name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create (example: v1.0.1-1.12.2)"
        required: true
        type: string
      release_name:
        description: "Release title (defaults to tag)"
        required: false
        type: string
      prerelease:
        description: "Mark this release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew clean build --no-daemon

      - name: Locate built JAR
        id: jar
        run: |
          JAR_PATH="$(ls build/libs/*.jar | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "No jar found in build/libs"
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' already exists locally."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: ${{ steps.jar.outputs.path }}
