name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release title (defaults to tag)"
        required: false
        type: string
      prerelease:
        description: "Mark this release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew clean build --no-daemon

      - name: Locate built JAR
        id: jar
        run: |
          JAR_PATH="$(ls build/libs/*.jar | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "No jar found in build/libs"
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Resolve tag from Gradle version
        id: tag
        run: |
          VERSION="$(./gradlew -q properties | awk -F': ' '/^version:/ {print $2; exit}')"
          if [ -z "$VERSION" ]; then
            echo "Unable to read project version from Gradle."
            exit 1
          fi
          echo "name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' already exists locally."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || steps.tag.outputs.name }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: ${{ steps.jar.outputs.path }}
